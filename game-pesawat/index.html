<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Langit Pasifik</title>
<style>
  html,body{margin:0;height:100%;background:#0b1a2a;overflow:hidden;touch-action:none;
    font-family:"Courier New",monospace;color:#fff;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#1d5b8c;image-rendering:pixelated;box-shadow:0 0 30px #000}
  #rollBtn{position:fixed;right:18px;bottom:24px;width:78px;height:78px;border-radius:50%;
    border:3px solid #ffd54a;background:rgba(0,0,0,.35);color:#ffd54a;font:bold 14px "Courier New",monospace;
    display:none;align-items:center;justify-content:center;text-align:center;line-height:1.1}
  #rollBtn.on{display:flex}
  #rollBtn:active{background:rgba(255,213,74,.3)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="rollBtn">PUTAR<br>(<span id="rollN">3</span>)</div>
<script>
(() => {
"use strict";
const W = 360, H = 640;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
cv.width = W; cv.height = H;
function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W*s)+"px"; cv.style.height = (H*s)+"px";
}
addEventListener("resize", fit); fit();

// ---------- Input ----------
const keys = {};
addEventListener("keydown", e => { keys[e.code] = true;
  if (e.code === "KeyX" || e.code === "ShiftLeft") tryRoll();
  if (e.code === "Enter" || e.code === "Space") startOrRestart();
  if (e.code === "KeyP") paused = !paused;
});
addEventListener("keyup", e => keys[e.code] = false);

let touchId = null, lastTX = 0, lastTY = 0;
function toGame(t){ const r = cv.getBoundingClientRect();
  return { x:(t.clientX-r.left)*W/r.width, y:(t.clientY-r.top)*H/r.height }; }
cv.addEventListener("touchstart", e => { e.preventDefault();
  if (state !== "play") { startOrRestart(); return; }
  const t = e.changedTouches[0]; touchId = t.identifier; const p = toGame(t); lastTX = p.x; lastTY = p.y; }, {passive:false});
cv.addEventListener("touchmove", e => { e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === touchId) {
    const p = toGame(t);
    player.x += (p.x - lastTX) * 1.3; player.y += (p.y - lastTY) * 1.3;
    lastTX = p.x; lastTY = p.y;
  } }, {passive:false});
cv.addEventListener("touchend", e => { for (const t of e.changedTouches) if (t.identifier === touchId) touchId = null; });
cv.addEventListener("mousedown", () => { if (state !== "play") startOrRestart(); });
const rollBtn = document.getElementById("rollBtn");
rollBtn.addEventListener("touchstart", e => { e.preventDefault(); tryRoll(); }, {passive:false});
rollBtn.addEventListener("mousedown", tryRoll);

// ---------- Audio (tiny synth) ----------
let ac = null;
function beep(freq, dur, type="square", vol=0.05, slide=0){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq+slide), ac.currentTime+dur);
  g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
}
const sfx = {
  shoot: () => beep(880, .05, "square", .015, -400),
  hit:   () => beep(200, .08, "sawtooth", .03, -100),
  boom:  () => { beep(120, .35, "sawtooth", .06, -90); beep(60, .4, "triangle", .06, -30); },
  power: () => { beep(523,.08); setTimeout(()=>beep(784,.08),80); setTimeout(()=>beep(1046,.12),160); },
  roll:  () => beep(300, .5, "triangle", .05, 500),
  hurt:  () => beep(90, .6, "sawtooth", .08, -60),
};

// ---------- State ----------
let state = "title", paused = false;
let score = 0, hiscore = +(localStorage.getItem("lp_hi") || 0);
let stage = 1, stageTime = 0, bossActive = false, stageClearT = 0;
let bgY = 0, islands = [], clouds = [];
let bullets = [], eBullets = [], enemies = [], parts = [], items = [], floaters = [];
let player;
let shake = 0;

function resetPlayer(){
  player = { x:W/2, y:H-90, w:30, h:26, lives:3, power:1, rolls:3, rollT:0,
             inv:120, cd:0, wing:false };
  updRollBtn();
}
function updRollBtn(){ document.getElementById("rollN").textContent = player ? player.rolls : 3; }

function startOrRestart(){
  if (!ac) { try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  if (state === "play") return;
  score = 0; stage = 1; stageTime = 0; bossActive = false; stageClearT = 0;
  bullets = []; eBullets = []; enemies = []; parts = []; items = []; floaters = [];
  resetPlayer(); state = "play"; rollBtn.classList.add("on");
}

function tryRoll(){
  if (state !== "play" || player.rolls <= 0 || player.rollT > 0) return;
  player.rolls--; player.rollT = 70; updRollBtn(); sfx.roll();
}

// ---------- Background ----------
function makeIsland(y){
  const pts = [], n = 10, r = 30 + Math.random()*50;
  for (let i=0;i<n;i++){ const a = i/n*Math.PI*2; pts.push([Math.cos(a)*r*(0.7+Math.random()*0.5), Math.sin(a)*r*(0.6+Math.random()*0.5)]); }
  return { x: Math.random()*W, y, pts, palms: Math.floor(Math.random()*4)+1 };
}
for (let i=0;i<4;i++) islands.push(makeIsland(Math.random()*H));
for (let i=0;i<5;i++) clouds.push({x:Math.random()*W, y:Math.random()*H, s:0.6+Math.random()*0.8});

function drawBG(){
  ctx.fillStyle = "#1d5b8c"; ctx.fillRect(0,0,W,H);
  // waves
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  for (let y=-40; y<H+40; y+=40){
    const yy = (y + bgY*0.5) % (H+40) - 20;
    for (let x=(y/40%2)*30; x<W; x+=60) ctx.fillRect(x, yy, 18, 2);
  }
  for (const is of islands){
    ctx.save(); ctx.translate(is.x, is.y);
    ctx.fillStyle = "#e8d39a"; ctx.beginPath();
    is.pts.forEach((p,i)=> i?ctx.lineTo(p[0]*1.15,p[1]*1.15):ctx.moveTo(p[0]*1.15,p[1]*1.15)); ctx.fill();
    ctx.fillStyle = "#3f8f3a"; ctx.beginPath();
    is.pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.fill();
    ctx.fillStyle = "#2c6b2a";
    for (let k=0;k<is.palms;k++){ ctx.beginPath(); ctx.arc(-15+k*10, -5+(k%2)*10, 6, 0, 7); ctx.fill(); }
    ctx.restore();
  }
}
function drawClouds(){
  for (const c of clouds){
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 22*c.s, 0, 7); ctx.arc(c.x+20*c.s, c.y+6*c.s, 18*c.s, 0, 7); ctx.arc(c.x-20*c.s, c.y+8*c.s, 16*c.s, 0, 7);
    ctx.fill();
  }
}
function updBG(){
  bgY += 1;
  for (const is of islands){ is.y += 0.8; if (is.y > H+100){ Object.assign(is, makeIsland(-100)); } }
  for (const c of clouds){ c.y += 2.2*c.s; if (c.y > H+60){ c.y = -60; c.x = Math.random()*W; } }
}

// ---------- Sprites (drawn with shapes) ----------
function drawPlayerPlane(x, y, scale=1, roll=0){
  ctx.save(); ctx.translate(x,y);
  const sx = Math.cos(roll) * scale;
  ctx.scale(sx || 0.05, scale);
  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(-14+10, -4+20, 28, 6);
  // wings
  ctx.fillStyle = "#4b6b3a"; ctx.fillRect(-17, -2, 34, 8);
  ctx.fillStyle = "#3b5a2c"; ctx.fillRect(-17, 4, 34, 2);
  // twin booms
  ctx.fillStyle = "#56783f"; ctx.fillRect(-11, -10, 4, 26); ctx.fillRect(7, -10, 4, 26);
  ctx.fillRect(-11, 14, 22, 3);
  // fuselage
  ctx.fillStyle = "#6a8f50"; ctx.fillRect(-3, -14, 6, 24);
  ctx.fillStyle = "#9fd3ff"; ctx.fillRect(-2, -8, 4, 5);
  // stars
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-13,2,2.2,0,7); ctx.arc(13,2,2.2,0,7); ctx.fill();
  // props
  const t = performance.now()/30;
  ctx.fillStyle = "rgba(220,220,220,0.7)";
  ctx.fillRect(-9-5*Math.abs(Math.sin(t)), -13, 10*Math.abs(Math.sin(t)), 2);
  ctx.fillRect(9-5*Math.abs(Math.sin(t)), -13, 10*Math.abs(Math.sin(t)), 2);
  ctx.restore();
}
function drawEnemy(e){
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.flash > 0) ctx.globalAlpha = 0.6;
  if (e.type === "boss"){
    ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(-55+15, -10+30, 110, 16);
    ctx.fillStyle = e.flash>0 ? "#fff" : "#7d7f86"; ctx.fillRect(-60, -6, 120, 16);
    ctx.fillStyle = e.flash>0 ? "#fff" : "#5e6067"; ctx.fillRect(-10, -30, 20, 64); ctx.fillRect(-26, 26, 52, 8);
    ctx.fillStyle = "#9b9da4";
    for (const ex of [-42,-22,22,42]) ctx.fillRect(ex-4, -14, 8, 18);
    ctx.fillStyle = "#c33"; ctx.beginPath(); ctx.arc(-40,2,4,0,7); ctx.arc(40,2,4,0,7); ctx.fill();
    ctx.fillStyle = "#333"; ctx.fillRect(-5,-22,10,8);
    ctx.restore();
    // health bar
    ctx.fillStyle = "#300"; ctx.fillRect(40, 8, W-80, 6);
    ctx.fillStyle = "#f44"; ctx.fillRect(40, 8, (W-80)*Math.max(0,e.hp/e.maxHp), 6);
    return;
  }
  const colors = { small:"#c9c5b0", red:"#c0392b", big:"#6d6f75", dive:"#a8a37f" };
  const c = e.flash>0 ? "#fff" : colors[e.type];
  const s = e.type === "big" ? 1.7 : 1;
  ctx.scale(s, s);
  ctx.fillStyle = "rgba(0,0,0,0.22)"; ctx.fillRect(-12+8, -2+16, 24, 5);
  ctx.fillStyle = c;
  ctx.fillRect(-13, -4, 26, 6);    // wings
  ctx.fillRect(-3, -12, 6, 24);    // fuselage
  ctx.fillRect(-6, -12, 12, 3);    // tail
  ctx.fillStyle = "#c33"; ctx.beginPath(); ctx.arc(-8,-1,2,0,7); ctx.arc(8,-1,2,0,7); ctx.fill();
  ctx.fillStyle = "#334"; ctx.fillRect(-2, 2, 4, 4);
  ctx.restore();
}

// ---------- Spawning ----------
function spawnWave(){
  const r = Math.random(), lvl = stage;
  if (r < 0.35){ // formation from top in V
    const cx = 60 + Math.random()*(W-120);
    for (let i=0;i<5;i++) enemies.push(mk("small", cx + (i-2)*28, -20 - Math.abs(i-2)*22, {vy:2+lvl*0.2, wobble:i}));
  } else if (r < 0.55){ // side sweep
    const fromLeft = Math.random()<0.5;
    for (let i=0;i<5;i++) enemies.push(mk("small", fromLeft? -20 - i*30 : W+20+i*30, 80+Math.random()*40,
       {vx: fromLeft?2.6:-2.6, vy:0.6, sweep:true}));
  } else if (r < 0.75){ // red squad (drop power-up when all killed)
    const id = Math.random();
    const fromLeft = Math.random()<0.5;
    for (let i=0;i<5;i++) enemies.push(mk("red", fromLeft? -20-i*26 : W+20+i*26, 60,
       {vx: fromLeft?2.4:-2.4, vy:0, squad:id, curve:true, t:-i*10}));
  } else if (r < 0.9){ // divers
    for (let i=0;i<3;i++) enemies.push(mk("dive", 40+Math.random()*(W-80), -30-i*50, {vy:1.5, dive:true}));
  } else { // big plane
    enemies.push(mk("big", 60+Math.random()*(W-120), -40, {vy:0.7}));
  }
}
const HP = { small:1, red:1, dive:2, big:22 };
const PTS = { small:100, red:150, dive:200, big:1500 };
function mk(type, x, y, o){
  return Object.assign({type, x, y, vx:0, vy:1, hp:HP[type]+(type==="big"?stage*4:0), flash:0, t:0,
    fire: 60+Math.random()*120, r: type==="big"?24:12}, o);
}
function spawnBoss(){
  bossActive = true;
  const hp = 180 + stage*80;
  enemies.push({type:"boss", x:W/2, y:-60, vx:1.2, vy:1, hp, maxHp:hp, flash:0, t:0, fire:60, r:46, pts:10000*stage});
}

// ---------- Firing ----------
function playerFire(){
  const p = player, sp = -10;
  const add = (x,vx=0) => bullets.push({x:p.x+x, y:p.y-14, vx, vy:sp});
  if (p.power === 1){ add(-4); add(4); }
  else if (p.power === 2){ add(-8); add(0); add(8); }
  else { add(-10,-1.2); add(-4); add(4); add(10,1.2); }
  if (p.wing){ add(-26); add(26); }
  sfx.shoot();
}
function aimShot(e, speed=3.2, spread=0){
  const a = Math.atan2(player.y-e.y, player.x-e.x) + spread;
  eBullets.push({x:e.x, y:e.y+8, vx:Math.cos(a)*speed, vy:Math.sin(a)*speed});
}

// ---------- Effects ----------
function explode(x, y, n=14, big=false){
  for (let i=0;i<n;i++){
    const a = Math.random()*7, s = Math.random()*(big?5:3)+0.5;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*25,max:55,
      c: ["#ffd54a","#ff8a3d","#e74c3c","#888"][Math.floor(Math.random()*4)], r: big?4:2.5});
  }
  if (big) shake = 18;
}
function floatText(x,y,t){ floaters.push({x,y,t,life:50}); }

// ---------- Update ----------
let spawnT = 0;
function update(){
  updBG();
  if (state !== "play" || paused) { parts.forEach(stepPart); parts = parts.filter(p=>p.life>0); return; }
  stageTime++;
  const p = player;

  // movement (keyboard)
  const sp = 4;
  if (keys.ArrowLeft||keys.KeyA) p.x -= sp;
  if (keys.ArrowRight||keys.KeyD) p.x += sp;
  if (keys.ArrowUp||keys.KeyW) p.y -= sp;
  if (keys.ArrowDown||keys.KeyS) p.y += sp;
  p.x = Math.max(16, Math.min(W-16, p.x)); p.y = Math.max(40, Math.min(H-24, p.y));

  // auto fire
  if (p.cd-- <= 0 && p.rollT <= 0){ playerFire(); p.cd = 7; }
  if (p.rollT > 0) p.rollT--;
  if (p.inv > 0) p.inv--;

  // spawns
  const stageLen = 2400; // ~40 detik per stage
  if (stageClearT > 0){
    stageClearT--;
    if (stageClearT === 0){ stage++; stageTime = 0; bossActive = false; }
  } else if (stageTime < stageLen){
    if (--spawnT <= 0){ spawnWave(); spawnT = Math.max(40, 110 - stage*10); }
  } else if (!bossActive && enemies.length === 0){
    spawnBoss();
  }

  // bullets
  for (const b of bullets){ b.x += b.vx; b.y += b.vy; }
  bullets = bullets.filter(b => b.y > -10 && b.x > -10 && b.x < W+10);
  for (const b of eBullets){ b.x += b.vx; b.y += b.vy; }
  eBullets = eBullets.filter(b => b.y > -10 && b.y < H+10 && b.x > -10 && b.x < W+10);

  // enemies
  for (const e of enemies){
    e.t++; if (e.flash>0) e.flash--;
    if (e.type === "boss"){
      if (e.y < 110) e.y += e.vy;
      else { e.x += e.vx; if (e.x < 70 || e.x > W-70) e.vx *= -1; }
      if (--e.fire <= 0 && e.y >= 100){
        const phase = Math.floor(e.t/240)%3;
        if (phase === 0){ for (let k=-2;k<=2;k++) aimShot(e, 3, k*0.18); e.fire = 50; }
        else if (phase === 1){ for (let k=0;k<12;k++){ const a=k/12*Math.PI*2 + e.t*0.05;
            eBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*2.4,vy:Math.sin(a)*2.4}); } e.fire = 40; }
        else { aimShot({x:e.x-40,y:e.y},3.6); aimShot({x:e.x+40,y:e.y},3.6); e.fire = 18; }
      }
      continue;
    }
    if (e.curve){ if (e.t > 0){ e.x += e.vx; e.y += Math.sin(e.t*0.04)*2.2 + 0.4; } }
    else if (e.sweep){ e.x += e.vx; e.y += e.vy; }
    else if (e.dive){
      e.y += e.vy;
      if (e.y > 120 && !e.locked){ e.locked = true; const a = Math.atan2(p.y-e.y, p.x-e.x); e.vx = Math.cos(a)*4; e.vy = Math.sin(a)*4; }
      e.x += e.vx;
    } else {
      e.y += e.vy; if (e.wobble !== undefined) e.x += Math.sin((e.t+e.wobble*10)*0.05)*1.2;
    }
    if (--e.fire <= 0 && e.y > 0 && e.y < H*0.7){
      if (e.type === "big"){ for (let k=-1;k<=1;k++) aimShot(e, 3, k*0.25); e.fire = 70; }
      else { if (Math.random() < 0.5 + stage*0.08) aimShot(e, 2.6 + stage*0.2); e.fire = 120 + Math.random()*120; }
    }
  }
  enemies = enemies.filter(e => e.type==="boss" || (e.y < H+60 && e.y > -400 && e.x > -300 && e.x < W+300));

  // collisions: player bullets vs enemies
  for (const b of bullets){
    for (const e of enemies){
      if (e.hp <= 0) continue;
      const rx = e.type==="boss" ? 60 : e.r, ry = e.type==="boss" ? 30 : e.r;
      if (Math.abs(b.x-e.x) < rx && Math.abs(b.y-e.y) < ry){
        b.y = -999; e.hp--; e.flash = 3;
        if (e.hp <= 0) killEnemy(e); else if (e.type==="boss"||e.type==="big") sfx.hit();
        break;
      }
    }
  }
  enemies = enemies.filter(e => e.hp > 0);

  // player hit
  const vulnerable = p.inv <= 0 && p.rollT <= 0;
  if (vulnerable){
    for (const b of eBullets){
      if (Math.abs(b.x-p.x) < 6 && Math.abs(b.y-p.y) < 8){ b.y = 9999; hurt(); break; }
    }
    for (const e of enemies){
      const rr = e.type==="boss"?50:e.r;
      if (Math.abs(e.x-p.x) < rr && Math.abs(e.y-p.y) < rr){
        if (e.type !== "boss" && e.type !== "big"){ e.hp = 0; killEnemy(e); }
        hurt(); break;
      }
    }
    enemies = enemies.filter(e => e.hp > 0);
  }

  // items
  for (const it of items){
    it.y += 1.3; it.x += Math.sin(it.t++*0.05)*0.8;
    if (Math.abs(it.x-p.x) < 18 && Math.abs(it.y-p.y) < 18){
      it.got = true; sfx.power();
      if (it.k === "P"){ if (p.power < 3) { p.power++; floatText(p.x,p.y-20,"POWER UP"); } else if (!p.wing){ p.wing = true; floatText(p.x,p.y-20,"PENGAWAL!"); } else { score+=1000; floatText(p.x,p.y-20,"+1000"); } }
      else if (it.k === "R"){ p.rolls++; updRollBtn(); floatText(p.x,p.y-20,"+1 PUTAR"); }
      else if (it.k === "B"){ // bomb: clear bullets
        eBullets = []; for (const e of enemies) if (e.type!=="boss"){ e.hp=0; killEnemy(e); }
        enemies = enemies.filter(e=>e.hp>0); floatText(p.x,p.y-20,"BOM!"); shake = 12;
      }
      else if (it.k === "1"){ p.lives++; floatText(p.x,p.y-20,"+1 NYAWA"); }
    }
  }
  items = items.filter(it => !it.got && it.y < H+20);

  parts.forEach(stepPart); parts = parts.filter(q=>q.life>0);
  for (const f of floaters){ f.y -= 0.7; f.life--; } floaters = floaters.filter(f=>f.life>0);
  if (shake > 0) shake--;
}
function stepPart(q){ q.x += q.vx; q.y += q.vy; q.vx *= 0.96; q.vy *= 0.96; q.life--; }

function killEnemy(e){
  const pts = e.pts || PTS[e.type];
  score += pts; floatText(e.x, e.y, String(pts));
  if (e.type === "boss"){
    for (let k=0;k<6;k++) setTimeout(()=>{ explode(e.x+(Math.random()-0.5)*100, e.y+(Math.random()-0.5)*40, 30, true); sfx.boom(); }, k*150);
    eBullets = []; stageClearT = 240; player.lives = Math.min(player.lives+1, 9);
    items.push({x:e.x, y:e.y, k:"P", t:0});
  } else {
    explode(e.x, e.y, e.type==="big"?30:14, e.type==="big"); sfx.boom();
    if (e.type === "big") items.push({x:e.x, y:e.y, k: Math.random()<0.5?"B":"R", t:0});
    if (e.squad !== undefined){
      const rest = enemies.filter(o => o.squad === e.squad && o !== e && o.hp > 0);
      if (rest.length === 0) items.push({x:e.x, y:e.y, k: Math.random()<0.12?"1":"P", t:0});
    }
  }
  if (score > hiscore){ hiscore = score; localStorage.setItem("lp_hi", hiscore); }
}
function hurt(){
  const p = player;
  explode(p.x, p.y, 30, true); sfx.hurt();
  p.lives--; p.power = Math.max(1, p.power-1); p.wing = false; p.inv = 150;
  eBullets = [];
  if (p.lives <= 0){ state = "over"; rollBtn.classList.remove("on"); }
}

// ---------- Draw ----------
function draw(){
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawBG();
  for (const it of items){
    ctx.fillStyle = {P:"#e74c3c", R:"#3498db", B:"#2c3e50", "1":"#27ae60"}[it.k];
    ctx.beginPath(); ctx.arc(it.x, it.y, 11, 0, 7); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = "bold 13px Courier New"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(it.k, it.x, it.y+1);
  }
  for (const e of enemies) drawEnemy(e);
  if (state === "play"){
    const p = player;
    const blink = p.inv > 0 && Math.floor(p.inv/5)%2;
    if (!blink){
      const rollAng = p.rollT > 0 ? (70-p.rollT)/70*Math.PI*2 : 0;
      const sc = p.rollT > 0 ? 1 + Math.sin((70-p.rollT)/70*Math.PI)*0.5 : 1;
      drawPlayerPlane(p.x, p.y, sc, rollAng);
      if (p.wing){ drawPlayerPlane(p.x-26, p.y+6, 0.55); drawPlayerPlane(p.x+26, p.y+6, 0.55); }
    }
  }
  ctx.fillStyle = "#ffe98a";
  for (const b of bullets) ctx.fillRect(b.x-1.5, b.y-6, 3, 10);
  for (const b of eBullets){ ctx.fillStyle = "#ff5a3c"; ctx.beginPath(); ctx.arc(b.x,b.y,3.5,0,7); ctx.fill();
    ctx.fillStyle = "#fff3"; ctx.beginPath(); ctx.arc(b.x,b.y,6,0,7); ctx.fill(); }
  for (const q of parts){ ctx.globalAlpha = Math.max(0,q.life/q.max); ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,7); ctx.fill(); }
  ctx.globalAlpha = 1;
  drawClouds();
  ctx.font = "bold 12px Courier New"; ctx.textAlign = "center";
  for (const f of floaters){ ctx.globalAlpha = f.life/50; ctx.fillStyle = "#fff"; ctx.fillText(f.t, f.x, f.y); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(0,0,W,24);
  ctx.font = "bold 13px Courier New"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff";
  ctx.textAlign = "left"; ctx.fillText("SKOR " + score, 8, 12);
  ctx.textAlign = "center"; ctx.fillText("TERTINGGI " + hiscore, W/2+20, 12);
  if (state === "play"){
    ctx.textAlign = "right"; ctx.fillText("ST " + stage, W-8, 12);
    for (let i=0;i<Math.min(player.lives,6);i++) drawPlayerPlane(16+i*20, H-16, 0.5);
  }

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (state === "title"){
    shadowText("LANGIT PASIFIK", W/2, H*0.33, 32, "#ffd54a");
    shadowText("Pertempuran Udara 1942", W/2, H*0.33+34, 14, "#fff");
    const lines = ["Geser jari untuk terbang","Tembak otomatis","Tombol PUTAR = manuver","menghindar (kebal sesaat)","",
      "P=Power  R=+Putar  B=Bom  1=Nyawa","Tembak habis skuadron MERAH","untuk dapat item!"];
    lines.forEach((l,i)=> shadowText(l, W/2, H*0.5+i*20, 13, "#e0f0ff"));
    if (Math.floor(performance.now()/500)%2) shadowText("SENTUH UNTUK MULAI", W/2, H*0.88, 18, "#fff");
  } else if (state === "over"){
    shadowText("GAME OVER", W/2, H*0.4, 34, "#ff5a3c");
    shadowText("Skor: " + score, W/2, H*0.4+40, 18, "#fff");
    shadowText("Stage: " + stage, W/2, H*0.4+64, 15, "#fff");
    if (Math.floor(performance.now()/500)%2) shadowText("SENTUH UNTUK ULANG", W/2, H*0.72, 18, "#fff");
  } else if (paused){
    shadowText("JEDA", W/2, H/2, 30, "#fff");
  } else if (stageClearT > 0){
    shadowText("STAGE " + stage + " SELESAI!", W/2, H*0.4, 24, "#ffd54a");
    shadowText("+1 NYAWA", W/2, H*0.4+30, 15, "#fff");
  } else if (stageTime < 120){
    shadowText("STAGE " + stage, W/2, H*0.4, 28, "#fff");
  } else if (bossActive && enemies.some(e=>e.type==="boss" && e.y < 100)){
    shadowText("PERINGATAN: PEMBOM BESAR!", W/2, H*0.45, 16, "#ff5a3c");
  }
}
function shadowText(t,x,y,size,color){
  ctx.font = "bold "+size+"px Courier New";
  ctx.fillStyle = "#000"; ctx.fillText(t, x+2, y+2);
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}

// ---------- Loop (fixed 60fps step) ----------
let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000/60){ update(); acc -= 1000/60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener("visibilitychange", () => { if (document.hidden && state==="play") paused = true; });
cv.addEventListener("touchstart", () => { if (paused) paused = false; });
})();
</script>
</body>
</html>
